<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2948">
<title>Klinik CG — Démo complète</title>
<style>
:root{--navy:#0d2948;--teal:#087f83;--teal2:#0b9a95;--mint:#e8f7f5;--bg:#f4f7fa;--card:#fff;--line:#dfe7ec;--text:#17324d;--muted:#6d7f8f;--green:#23804a;--yellow:#a57416;--red:#b44545;--purple:#5b45a6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:16px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:22px;color:var(--navy)}.logo{width:40px;height:40px;border:4px solid var(--teal);border-radius:13px;position:relative;display:grid;place-items:center;color:var(--navy);font-weight:1000}.logo:before{content:"+";font-size:24px;line-height:1}.logo:after{content:"";position:absolute;width:8px;height:8px;background:var(--teal);border-radius:50%;right:-4px;top:-4px}.brand span{color:var(--teal)}.demo{margin-left:auto;background:#fff1d5;color:#80601c;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;letter-spacing:.6px}.role{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--navy);font-weight:750}
.shell{max-width:1250px;margin:auto;display:flex;min-height:calc(100vh - 68px)}aside{width:225px;padding:18px 10px;border-right:1px solid var(--line);background:#fff}aside button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 13px;border-radius:10px;color:var(--muted);font-weight:750;margin:2px 0;cursor:pointer}aside button.active,aside button:hover{background:var(--mint);color:var(--teal)}main{flex:1;padding:22px 18px 70px}.ey{font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--teal)}h1{font-size:36px;line-height:1.05;margin:7px 0 12px;letter-spacing:-1px}h2{margin:4px 0 9px}h3{margin:4px 0 7px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin:0 0 13px;box-shadow:0 3px 15px #0d29480a}.hero{background:linear-gradient(135deg,#e4f7f4,#fff);padding:25px}.search{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--teal);color:#fff;font-weight:850;cursor:pointer}.btn:hover{background:var(--teal2)}.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}.btn.red{background:#fff0f0;color:var(--red);border:1px solid #f0caca}.btn.full{width:100%;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi b{display:block;font-size:25px}.row{display:flex;align-items:center;gap:11px}.between{justify-content:space-between}.avatar{width:54px;height:54px;border-radius:50%;background:#eaf0f4;display:grid;place-items:center;font-weight:900;color:var(--navy)}.tag,.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900}.tag{background:var(--mint);color:var(--teal)}.status{background:#eaf7ee;color:var(--green)}.status.wait{background:#fff2d5;color:var(--yellow)}.status.cancel{background:#fdecec;color:var(--red)}.status.purple{background:#f0edff;color:var(--purple)}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px;cursor:pointer}.slot.sel{border-color:var(--teal);background:var(--mint);color:var(--teal);font-weight:900}.list{display:grid;gap:7px}.listrow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.notice{background:#f0f8f6;border-left:4px solid var(--teal);padding:12px;border-radius:7px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.money{font-weight:900}.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:8px;cursor:pointer}.footer{text-align:center;color:#8493a0;font-size:10px;margin-top:28px}
@media(max-width:850px){aside{display:none}.shell{display:block}main{padding:15px 11px 60px}.top{padding:0 11px;height:62px}.brand{font-size:19px}.demo{display:none}.role{font-size:11px;margin-left:auto}.grid,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.search{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}.listrow{align-items:flex-start;flex-wrap:wrap}}
</style>

<script>
const doctors=[
{id:1,n:"Dr. Sarah MABIALA",s:"Cardiologue",clinic:"Netcare",q:"Centre-ville",price:25000,rating:4.8,initial:"SM",slots:["09h00","10h00","14h30","16h00"]},
{id:2,n:"Dr. Patrick NGOMA",s:"Médecin généraliste",clinic:"Netcare",q:"Loandjili",price:15000,rating:4.7,initial:"PN",slots:["09h00","11h00","15h30"]},
{id:3,n:"Dr. Grâce MBOUNGOU",s:"Pédiatre",clinic:"Netcare",q:"Tié-Tié",price:20000,rating:4.9,initial:"GM",slots:["09h00","09h30","14h00"]},
{id:4,n:"Dr. Nadia KIMBEMBE",s:"Gynécologue",clinic:"Netcare",q:"OCH",price:25000,rating:4.8,initial:"NK",slots:["09h00","10h00","15h00"]},
{id:5,n:"Dr. Kevin BAZEBI",s:"Dentiste",clinic:"Netcare",q:"Mpita",price:20000,rating:4.6,initial:"KB",slots:["10h30","11h00","16h00"]}
];
let state={role:"patient",page:"home",doctor:doctors[0],slot:null,query:"",appt:null,status:"Confirmé"};
const main=document.getElementById("main"),side=document.getElementById("side");
const money=n=>n.toLocaleString("fr-FR")+" FCFA";
function setRole(r){state.role=r;state.page=r==="patient"?"home":r;render()}
function nav(items){side.innerHTML=items.map(([id,label])=>`<button class="${state.page===id?'active':''}" onclick="state.page='${id}';render()">${label}</button>`).join("")}
function card(d){return `<div class="card"><div class="row"><div class="avatar">${d.initial}</div><div><b>${d.n}</b><div class="muted">${d.s}</div></div></div><p class="muted">${d.clinic} · ${d.q} · Pointe-Noire</p><div class="row between"><span>⭐ ${d.rating} · avis fictifs</span><b>${money(d.price)}</b></div><p><span class="tag">Prochain créneau : ${d.slots[0]}</span></p><button class="btn full" onclick="state.doctor=doctors.find(x=>x.id===${d.id});state.page='profileDoctor';render()">Voir le profil</button></div>`}
function render(){
document.getElementById("role").value=state.role;
if(state.role==="patient"){nav([["home","🏠 Accueil"],["search","🔎 Rechercher"],["appointments","📅 Mes rendez-vous"],["messages","💬 Messages"],["profile","👤 Mon profil"]]);patient()}
if(state.role==="doctor"){nav([["doctor","📊 Tableau de bord"],["agenda","📅 Agenda"],["patients","👥 Patients"],["tele","💻 Téléconsultation"],["revenues","💰 Revenus"]]);doctor()}
if(state.role==="clinic"){nav([["clinic","📊 Tableau de bord"],["rdv","📅 Rendez-vous"],["meds","👨🏾‍⚕️ Médecins"],["patients","👥 Patients"],["finance","💰 Revenus"]]);clinic()}
if(state.role==="admin"){nav([["admin","📊 Tableau de bord"],["rdvs","📅 Rendez-vous"],["users","👥 Utilisateurs"],["economy","💰 Modèle économique"],["reset","↻ Réinitialiser"]]);admin()}
}
function patient(){
if(state.page==="home")main.innerHTML=`<section class="card hero"><div class="ey">Pointe-Noire · République du Congo</div><h1>Trouvez votre professionnel de santé.</h1><p class="muted">Prenez rendez-vous simplement, rapidement et en toute sérénité.</p><div class="search"><input id="q" class="field" placeholder="Médecin, spécialité…"><input class="field" value="Pointe-Noire" readonly><button class="btn" onclick="state.query=document.getElementById('q').value;state.page='search';render()">Rechercher</button></div></section><div class="grid">${doctors.slice(0,3).map(card).join("")}</div>`;
if(state.page==="search"){let q=(state.query||"").toLowerCase();let arr=doctors.filter(d=>!q||(`${d.n} ${d.s} ${d.clinic} ${d.q}`).toLowerCase().includes(q));main.innerHTML=`<button class="back" onclick="state.page='home';render()">← Accueil</button><div class="ey">Recherche</div><h1>Professionnels à Pointe-Noire</h1><div class="search"><input id="q2" class="field" value="${state.query}" placeholder="Spécialité ou médecin"><select class="field"><option>Toutes les spécialités</option><option>Cardiologue</option><option>Pédiatre</option><option>Gynécologue</option></select><button class="btn" onclick="state.query=document.getElementById('q2').value;render()">Filtrer</button></div><p class="muted">${arr.length} résultat(s)</p><div class="grid">${arr.map(card).join("")}</div>`}
if(state.page==="profileDoctor"){let d=state.doctor;main.innerHTML=`<button class="back" onclick="state.page='search';render()">← Retour aux résultats</button><div class="grid2"><div class="card"><div class="row"><div class="avatar" style="width:78px;height:78px">${d.initial}</div><div><span class="tag">${d.s}</span><h2>${d.n}</h2></div></div><p>${d.s}, 12 ans d’expérience.</p><p class="muted">${d.clinic} · ${d.q}, Pointe-Noire</p><p>⭐ ${d.rating} · 32 avis fictifs</p><h2>${money(d.price)}</h2><div class="notice">Profil et avis fictifs — démonstration uniquement.</div></div><div class="card"><div class="ey">Disponibilités</div><h2>Mercredi 2 septembre 2026</h2><div class="slots">${d.slots.map(x=>`<button class="slot ${state.slot===x?'sel':''}" onclick="state.slot='${x}';render()">${x}</button>`).join("")}</div><button class="btn full" onclick="if(!state.slot){alert('Choisissez un créneau.');return}state.page='booking';render()">Prendre rendez-vous</button></div></div>`}
